<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Catálogo - Bebidas Energéticas y Tés</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .producto { border: 1px solid #ccc; padding: 15px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <h1>Catálogo de Productos</h1>
    <p>Explora nuestra selección de tés exóticos y bebidas energéticas.</p>
    
    <!-- Aquí aparecerán los productos cargados desde el JSON -->
    <div id="contenedor-productos"></div>

    <script>
<!-- Aquí aparecerán los productos cargados desde el JSON -->
    <div id="contenedor-productos"></div>

    <script>
        const contenedor = document.getElementById('contenedor-productos');

        async function cargarProductos() {
            try {
                const respuesta = await fetch('./productos.json'); 
                if (!respuesta.ok) {
                    throw new Error(`HTTP error! status: ${respuesta.status}`);
                }
                const productos = await fetch('./productos.json').then(res => res.json());
                mostrarProductos(productos);
            } catch (error) {
                console.error("Error al cargar los productos:", error);
                contenedor.innerHTML = "<p>Error al cargar el catálogo.</p>";
            }
        }

        function mostrarProductos(listaProductos) {
            contenedor.innerHTML = '';
            listaProductos.forEach(producto => {
                const divProducto = document.createElement('div');
                divProducto.className = 'producto';
                divProducto.innerHTML = `
                    <h3>${producto.nombre}</h3>
                    <p><strong>Categoría:</strong> ${producto.categoria}</p>
                    <p><strong>Precio:</strong> $${producto.precio}</p>
                    <p><strong>Stock disponible:</strong> ${producto.stock}</p>
                    <button onclick="agregarAlCarrito(${producto.id})">Agregar al Carrito</button>
                `;
                contenedor.appendChild(divProducto);
            });
        }

        function agregarAlCarrito(idProducto) {
            alert("Producto con ID " + idProducto + " agregado al carrito (Simulación).");
        }

        cargarProductos();
    </script>
</body>
</html>
